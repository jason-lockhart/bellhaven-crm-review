# Example only: this file is outside .github/workflows and is not scheduled.
# Copy it to .github/workflows/daily-review.yml to enable a read-only daily scan.
name: Bellhaven daily read-only review

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  stage-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r artifacts/bellhaven-crm-review/backend/requirements.txt
      - name: Run read-only reconciliation
        env:
          CLIPBOARD_API_TOKEN: ${{ secrets.CLIPBOARD_API_TOKEN }}
          BELLHAVEN_DB_PATH: ${{ github.workspace }}/bellhaven-review.sqlite3
        run: python -m backend.daily_review
        working-directory: artifacts/bellhaven-crm-review
