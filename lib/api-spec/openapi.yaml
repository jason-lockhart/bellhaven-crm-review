openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bellhaven/review/health:
    get:
      operationId: getBellhavenReviewHealth
      tags: [bellhaven-review]
      summary: Get review service readiness
      responses:
        "200":
          description: Service readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHealth"
  /bellhaven/review/summary:
    get:
      operationId: getBellhavenReviewSummary
      tags: [bellhaven-review]
      summary: Get review dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
  /bellhaven/review/communities:
    get:
      operationId: listBellhavenCommunities
      tags: [bellhaven-review]
      summary: List communities from the latest website scrape
      responses:
        "200":
          description: Scraped website communities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Community"
  /bellhaven/review/proposals:
    get:
      operationId: listBellhavenProposals
      tags: [bellhaven-review]
      summary: List saved reconciliation proposals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPage"
  /bellhaven/review/activity:
    get:
      operationId: listBellhavenReviewActivity
      tags: [bellhaven-review]
      summary: List recent review decisions
      responses:
        "200":
          description: Recent review activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewActivity"
  /bellhaven/review/run:
    post:
      operationId: runBellhavenReconciliation
      tags: [bellhaven-review]
      summary: Scrape communities and stage proposals without CRM writes
      responses:
        "200":
          description: Reconciliation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "503":
          description: CRM access is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
  /bellhaven/review/proposals/{proposal_id}/decision:
    post:
      operationId: decideBellhavenProposal
      tags: [bellhaven-review]
      summary: Approve or reject a proposal
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "404":
          description: Proposal not found
        "409":
          description: Proposal already decided or CRM write could not be reconciled
        "503":
          description: CRM access is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReviewHealth:
      type: object
      properties:
        status:
          type: string
        website_available:
          type: boolean
        crm_configured:
          type: boolean
        read_only:
          type: boolean
        last_run_at:
          type: ["string", "null"]
      required: [status, website_available, crm_configured, read_only]
    Community:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        care_offerings:
          type: array
          items: { type: string }
        source_url: { type: string }
      required: [slug, name, address, city, state, zip, care_offerings, source_url]
    AccountSnapshot:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        parent_id: { type: ["string", "null"] }
        parent_name: { type: ["string", "null"] }
        lifetime_revenue: { type: ["number", "null"] }
        outstanding_ar: { type: ["number", "null"] }
        chow_current_account: { type: ["string", "null"] }
        status: { type: ["string", "null"], enum: [Active, Inactive, Needs Review, null] }
        notes: { type: ["string", "null"] }
        duplicate_of_account: { type: ["string", "null"] }
      required: [id, name, street, city, state, zip, parent_id, parent_name, lifetime_revenue, outstanding_ar, chow_current_account, status, notes, duplicate_of_account]
    ProposedChange:
      type: object
      properties:
        field: { type: string }
        before: { type: ["string", "number", "boolean", "null"] }
        after: { type: ["string", "number", "boolean", "null"] }
      required: [field, before, after]
    Proposal:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [missing_account, address_update, parent_change, stale_account, duplicate_account, ambiguous_match]
        status: { type: string, enum: [pending, approved, rejected] }
        confidence: { type: number }
        risk_level: { type: string, enum: [low, medium, high] }
        title: { type: string }
        summary: { type: string }
        community: { anyOf: [{ $ref: "#/components/schemas/Community" }, { type: "null" }] }
        account: { anyOf: [{ $ref: "#/components/schemas/AccountSnapshot" }, { type: "null" }] }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ProposedChange" }
        evidence:
          type: array
          items: { type: string }
        manual_review: { type: boolean }
        reviewer_notes: { type: ["string", "null"] }
        crm_write_status:
          type: string
          enum: [not_started, not_applicable, waiting_for_token, applying, created, applied, failed]
        crm_write_error: { type: ["string", "null"] }
        crm_result_account_id: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
      required: [id, type, status, confidence, risk_level, title, summary, community, account, changes, evidence, manual_review, reviewer_notes, crm_write_status, crm_write_error, crm_result_account_id, created_at]
    ProposalPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
      required: [items, total, page, page_size]
    ReviewSummary:
      type: object
      properties:
        total_communities: { type: integer }
        total_accounts: { type: integer }
        pending_count: { type: integer }
        approved_count: { type: integer }
        rejected_count: { type: integer }
        high_risk_count: { type: integer }
        last_run_at: { type: ["string", "null"] }
        crm_configured: { type: boolean }
      required: [total_communities, total_accounts, pending_count, approved_count, rejected_count, high_risk_count, last_run_at, crm_configured]
    ReviewActivity:
      type: object
      properties:
        proposal_id: { type: string }
        title: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        reviewer_notes: { type: ["string", "null"] }
        crm_write_status:
          type: string
          enum: [not_started, not_applicable, waiting_for_token, applying, created, applied, failed]
        decided_at: { type: string, format: date-time }
      required: [proposal_id, title, decision, reviewer_notes, crm_write_status, decided_at]
    RunResult:
      type: object
      properties:
        status: { type: string }
        communities_scanned: { type: integer }
        accounts_scanned: { type: integer }
        proposals_created: { type: integer }
        proposals_existing: { type: integer }
        warnings:
          type: array
          items: { type: string }
      required: [status, communities_scanned, accounts_scanned, proposals_created, proposals_existing, warnings]
    DecisionInput:
      type: object
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reviewer_notes: { type: string }
      required: [decision]
    DecisionResult:
      type: object
      properties:
        proposal: { $ref: "#/components/schemas/Proposal" }
        message: { type: string }
        crm_updated: { type: boolean }
      required: [proposal, message, crm_updated]

